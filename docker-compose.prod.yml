# Өндіріс (Қазақстандағы VPS, ТТ 14.2): қосымша + PostgreSQL + Caddy (автоматты HTTPS).
# Іске қосу: docker compose -f docker-compose.prod.yml --env-file .env up -d --build
# Ескерту: Docker сол компьютерде орнатылмаған, сондықтан файл түнде іске қосылып тексерілген жоқ. Толық нұсқаулық: docs/DEPLOY.md
name: kfca-prod

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: kfca
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD міндетті}
      POSTGRES_DB: kfca
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kfca -d kfca']
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://kfca:${POSTGRES_PASSWORD}@postgres:5432/kfca
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:?PAYLOAD_SECRET міндетті}
      ALTCHA_HMAC_KEY: ${ALTCHA_HMAC_KEY:?ALTCHA_HMAC_KEY міндетті}
      TWOFA_ENC_KEY: ${TWOFA_ENC_KEY:?TWOFA_ENC_KEY міндетті}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?NEXT_PUBLIC_SITE_URL міндетті}
      ADMIN_2FA: ${ADMIN_2FA:-on}
      NOTIFY_EMAILS: ${NOTIFY_EMAILS:-}
    volumes:
      - appdata:/app/.data
    expose:
      - '3000'

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - '80:80'
      - '443:443'
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?SITE_DOMAIN міндетті}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config

volumes:
  pgdata:
  appdata:
  caddydata:
  caddyconfig:
